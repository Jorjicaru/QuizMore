# ==============================================================================
# CONQUIZ V9.0 – PRODUCTION DOCKER COMPOSE (PROXMOX + POSTGRESQL + CLOUDFLARED)
# ==============================================================================
# Notă de securitate: Niciun port (3000 sau 5432) nu este expus public pe host.
# Tot traficul extern intră exclusiv prin Cloudflare Tunnel (HTTPS + WSS) către
# serviciul intern http://app:3000.

services:
  db:
    image: postgres:16-alpine
    container_name: conquiz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-conquiz}
      POSTGRES_USER: ${POSTGRES_USER:-conquiz_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Seteaza POSTGRES_PASSWORD in .env}
    volumes:
      - conquiz_pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - conquiz_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-conquiz_user} -d ${POSTGRES_DB:-conquiz}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: conquiz-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_URL: ${APP_URL:-https://conquiz.domeniu.ro}
      JWT_SECRET: ${JWT_SECRET:?Seteaza JWT_SECRET in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@conquiz.ro}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-MareleVoievod}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Seteaza ADMIN_PASSWORD in .env}
      DATABASE_URL: postgresql://${POSTGRES_USER:-conquiz_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-conquiz}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - conquiz_appdata:/app/data
    networks:
      - conquiz_internal
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/readyz || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: conquiz-cloudflared
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:?Seteaza CLOUDFLARE_TUNNEL_TOKEN in .env}
    networks:
      - conquiz_internal

volumes:
  conquiz_pgdata:
    driver: local
  conquiz_appdata:
    driver: local

networks:
  conquiz_internal:
    driver: bridge
