# ==============================================================================
# CONQUIZ V9.1 – PRODUCTION DOCKER COMPOSE (PROXMOX + POSTGRESQL + NGINX PROXY MANAGER)
# ==============================================================================
# Arhitectură de rețea și securitate:
# 1. PostgreSQL (serviciul `db`) rulează EXCLUSIV în rețeaua internă izolată
#    `conquiz_internal`, fără niciun port expus pe host și fără acces din rețeaua NPM.
# 2. Aplicația (`app`, hostname `conquiz-app`, port intern `3000`) este conectată la:
#    - `conquiz_internal` (pentru comunicarea privată cu baza de date `db:5432`)
#    - `mediastack_default` (rețeaua Docker externă existentă în care rulează `nginx-proxy-manager`)
# 3. Portul 3000 al aplicației NU este publicat pe host. Nginx Proxy Manager accesează
#    aplicația direct prin rețeaua Docker `mediastack_default` la `http://conquiz-app:3000`.

services:
  db:
    image: postgres:16-alpine
    container_name: conquiz-postgres
    hostname: db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-conquiz}
      POSTGRES_USER: ${POSTGRES_USER:-conquiz_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Seteaza POSTGRES_PASSWORD in .env}
    volumes:
      - conquiz_pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - conquiz_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-conquiz_user} -d ${POSTGRES_DB:-conquiz}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: conquiz-app
    hostname: conquiz-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_URL: ${APP_URL:?Seteaza APP_URL cu subdomeniul tau real Porkbun in .env}
      JWT_SECRET: ${JWT_SECRET:?Seteaza JWT_SECRET in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Seteaza ADMIN_EMAIL in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-MareleVoievod}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Seteaza ADMIN_PASSWORD in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Seteaza POSTGRES_PASSWORD in .env}
      DATABASE_URL: postgresql://${POSTGRES_USER:-conquiz_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-conquiz}
    volumes:
      - conquiz_appdata:/app/data
    networks:
      - conquiz_internal
      - mediastack_default
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/readyz || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  conquiz_pgdata:
    driver: local
  conquiz_appdata:
    driver: local

networks:
  conquiz_internal:
    driver: bridge
    internal: true
  mediastack_default:
    external: true
    name: mediastack_default
