name: CONQUIZ CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Validate, Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate canonical question bank
        run: npm run validate:questions

      - name: TypeScript typecheck & lint
        run: npm run lint

      - name: Run unit & Socket.IO multiplayer integration tests
        run: npm test

      - name: Production Vite build
        run: npm run build
