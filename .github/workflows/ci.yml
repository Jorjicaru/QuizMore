name: CONQUIZ CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Validate, Lint, Test, Build & Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun (pinned version)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.4"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies with frozen lockfile
        run: bun install --frozen-lockfile

      - name: Validate canonical question bank
        run: bun run validate:questions

      - name: TypeScript typecheck & lint
        run: bun run lint

      - name: Run unit, PostgreSQL & Socket.IO multiplayer integration tests
        run: bun run test

      - name: Production Vite build
        run: bun run build

      - name: Verify production Docker image build
        run: docker build -t conquiz:ci-test .
